<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diario Macro</title>
<meta name="theme-color" content="#F2F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111510" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* Layout: una colonna, tre tab in basso. Oggi = quanto manca → cerca → pasti */
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --sunk:#E6EAE2; --ink:#172015; --muted:#5E6A5B; --line:#DDE3D8;
  --accent:#2E6A38; --accent-ink:#FFFFFF; --accent-soft:#DCEBD9;
  --p:#2C68A8; --c:#B97D12; --f:#8B3C7B; --warn:#B0501A; --warn-soft:#F6E2D5;
  --display:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111510; --surface:#1A2019; --sunk:#252D23; --ink:#E5EBE1; --muted:#9AA696; --line:#2D362A;
  --accent:#86C67F; --accent-ink:#0D140C; --accent-soft:#233322;
  --p:#86B4E8; --c:#E7B64F; --f:#D690C7; --warn:#EE9460; --warn-soft:#3A2519; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:4px 110px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:-.01em}
h2{font-size:1.15rem}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.55rem .85rem;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{background:transparent;border-color:transparent;color:var(--muted)}
button.danger{color:var(--warn);border-color:var(--warn);background:transparent}
button.big{height:54px;font-size:1.08rem;width:100%}
button:disabled{opacity:.45}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.55rem .7rem;width:100%;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between} .grow{flex:1;min-width:0}
[hidden]{display:none!important}

.top{display:flex;align-items:center;justify-content:space-between;padding-block:10px 2px}
.brand{font-family:var(--display);font-size:1.25rem;font-weight:700}
.datenav{display:flex;align-items:center;gap:2px}
.datenav button{border:0;background:transparent;font-size:1.3rem;padding:.2rem .6rem;color:var(--muted)}
.datenav .d{font-weight:600;min-width:6.5em;text-align:center}

/* riepilogo */
.hero{gap:14px}
.left{display:flex;align-items:baseline;gap:8px}
.left .n{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:1}
.left.over .n{color:var(--warn)}
.track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.fill{height:100%;border-radius:99px;background:var(--accent)}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mac .t{font-size:.8rem;color:var(--muted)} .mac .v{font-weight:600;font-size:.95rem}
.mac .track{height:6px;margin-top:4px}

/* ricerca */
.search{display:flex;gap:8px}
.sbox{position:relative;flex:1}
.sbox input{height:52px;padding-left:2.4rem;padding-right:2.4rem;border-radius:16px;font-size:17px;background:var(--surface)}
.sbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
.sbox .clear{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:1.4rem;color:var(--muted);padding:.2rem .6rem}
.scan{width:52px;height:52px;padding:0;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.scan svg{width:24px;height:24px}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.chip{border-radius:99px;padding:.45rem .85rem;font-size:.92rem;background:var(--surface);border:1px solid var(--line);white-space:nowrap;flex:none}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;padding:.75rem .85rem;border-radius:14px;background:var(--surface);border:1px solid var(--line);width:100%}
.res .rn{font-weight:600;min-width:0;overflow-wrap:anywhere}.res .rs{font-size:.8rem;color:var(--muted);font-weight:400}
.res .rk{font-size:.9rem;color:var(--muted);white-space:nowrap}
.list{display:flex;flex-direction:column;gap:6px}
.sec{display:flex;flex-direction:column;gap:6px}
.empty{color:var(--muted);font-size:.92rem}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;padding:.4rem 0;text-align:left}

/* pasti */
.meal h3{font-size:.95rem;display:flex;justify-content:space-between;text-transform:capitalize;color:var(--muted);font-weight:600;margin-bottom:2px}
.it{display:flex;justify-content:space-between;gap:10px;padding:.65rem 0;border-top:1px solid var(--line);cursor:pointer;align-items:baseline}
.meal .it:first-of-type{border-top:0}
.it .nm{min-width:0;overflow-wrap:anywhere}.it .g{color:var(--muted);font-size:.85rem;white-space:nowrap}
.it .k{font-weight:600;white-space:nowrap}
details summary{cursor:pointer;color:var(--muted);font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
.micro{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:12px}
.micro .t{display:flex;justify-content:space-between;font-size:.8rem}.micro .track{height:5px;margin-top:3px}

/* fogli */
.veil{position:fixed;inset:0;background:rgba(10,14,9,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet .head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.gbox{display:grid;grid-template-columns:68px 1fr 68px;gap:10px;align-items:center}
.step{height:68px;font-size:2rem;font-weight:600;border-radius:18px}
.gval{display:flex;align-items:baseline;justify-content:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:18px;height:68px;padding:0 10px}
.gval input{border:0;background:transparent;font-family:var(--display);font-size:2.4rem;font-weight:800;text-align:center;width:100%;padding:0;height:66px}
.gval span{font-size:1.1rem;color:var(--muted)}
.qmac{text-align:center;color:var(--muted)} .qmac b{color:var(--ink);font-size:1.1rem}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:.5rem .2rem;font-size:.88rem;text-transform:capitalize;border-radius:9px}
.seg button.on{background:var(--surface);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg.three{grid-template-columns:repeat(3,1fr)}
.pick{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:.7rem .85rem;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);width:100%;text-align:left}
.pick.on{border-color:var(--accent);background:var(--accent-soft)}
.pick .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--accent-ink)}
.pick.on .ck{background:var(--accent);border-color:var(--accent)}
.opt{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.opt.main{border:2px solid var(--accent)}
.opt .ln{display:flex;justify-content:space-between;gap:8px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.grid2 label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:4/3}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;left:10%;right:10%;top:38%;bottom:38%;border:3px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;position:relative}
.wk{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wk .b{width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.wk .b.o{background:var(--warn)} .wk .l{font-size:.72rem;color:var(--muted)} .wk .v{font-size:.68rem}
.tline{position:absolute;left:0;right:0;border-top:1.5px dashed var(--muted);opacity:.6}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs .in{display:flex;max-width:640px;width:100%}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:.6rem .2rem;font-size:.78rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}
.banner{background:var(--warn-soft);border-radius:12px;padding:10px 12px;font-size:.9rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:99px;font-size:.9rem;z-index:40;max-width:90%;text-align:center}
.hint{font-size:.82rem;color:var(--muted)}
.foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:10px calc(18px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px))}
.pick{padding:.6rem .85rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand" id="title">Oggi</div>
    <div class="datenav" id="datenav">
      <button id="prevDay" aria-label="Giorno precedente">‹</button>
      <div class="d" id="dateLabel"></div>
      <button id="nextDay" aria-label="Giorno successivo">›</button>
    </div>
  </header>

  <section id="p-oggi" style="display:flex;flex-direction:column;gap:14px">
    <div id="summary"></div>
    <div class="search">
      <div class="sbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" enterkeyhint="search" placeholder="Cosa hai mangiato?" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button class="clear" id="clearQ" aria-label="Cancella" hidden>×</button>
      </div>
      <button class="scan" id="scanBtn" aria-label="Scansiona codice a barre">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"/></svg></button>
    </div>
    <div id="results"></div>
    <div id="home">
      <div id="recent"></div>
      <div id="meals"></div>
    </div>
  </section>

  <section id="p-alimenti" hidden style="flex-direction:column;gap:14px">
    <div class="search"><div class="sbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="fq" type="search" placeholder="Cerca nel tuo archivio" autocomplete="off"></div>
      <button class="scan" id="scanBtn2" aria-label="Scansiona codice a barre"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V5a1 1 0 0 1 1-1h2M17 4h2a1 1 0 0 1 1 1v2M20 17v2a1 1 0 0 1-1 1h-2M7 20H5a1 1 0 0 1-1-1v-2M8 8v8M11 8v8M14 8v8M17 8v8"/></svg></button></div>
    <button class="primary big" id="newFood">+ Nuovo alimento dall’etichetta</button>
    <div id="flist"></div>
  </section>

  <section id="p-profilo" hidden style="flex-direction:column;gap:14px"><div id="profv" style="display:flex;flex-direction:column;gap:14px"></div></section>
</div>

<nav class="tabs"><div class="in" role="tablist">
  <button role="tab" data-tab="oggi" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Oggi</button>
  <button role="tab" data-tab="alimenti" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Alimenti</button>
  <button role="tab" data-tab="profilo" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profilo</button>
</div></nav>

<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
